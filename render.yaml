services:
  - type: web
    name: recoveriq-backend
    runtime: docker
    repo: https://github.com/14Aparajita/recoveriq
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: RecoverIQ
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false   # You'll fill this in the dashboard
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false   # Fill with Aiven MySQL URI
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: '["https://recoveriq-frontend.vercel.app"]'  # Update after frontend deploy
      - key: RATE_LIMIT_REQUESTS
        value: 100
      - key: RATE_LIMIT_PERIOD
        value: 60